# Only Fly's own style and Vale's built-in rules, the same setup as
# superfly/docs. styles/Fly and the fly-terms vocabulary live here. The
# Google, proselint and write-good packages are gone: nearly all of their
# rules were already off, and the rest flagged things nobody acted on. With
# no packages there is nothing for `vale sync` to fetch, so the workflow
# skips it.
#
# What runs: Fly.WordList, the house vocabulary, and Vale.Repetition, which
# catches doubled words.
StylesPath = styles

Vocab = fly-terms

MinAlertLevel = suggestion

SkippedScopes = script

[*.{md,mdx}]
BasedOnStyles = Fly, Vale

Fly.Exclamation = NO
Fly.Headings = NO
Fly.Latin = NO
Fly.Machine = NO
Fly.OxfordComma = NO
Fly.SentenceLength = NO
Fly.Spelling = NO # off for good, as in superfly/docs
Fly.Us = NO

Vale.Avoid = NO # its one reject-list entry, healthcheck, is already in Fly.WordList
Vale.Repetition = warning # error by default, which shows a doubled word as a red annotation
Vale.Spelling = NO # Fly.Spelling would replace it, and that's off
Vale.Terms = NO # too strict for technical docs with code examples

[formats]
mdx = md
